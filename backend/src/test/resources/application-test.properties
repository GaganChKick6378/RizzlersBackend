# Test configuration
# spring.profiles.active=test

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate ddl auto for tests - create tables
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Enable SQL initialization for tests
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# Disable flyway for tests
spring.flyway.enabled=false

# GraphQL mocks
graphql.endpoint=http://localhost:4000/graphql
graphql.api-key=test-api-key

# Port configuration
server.port=8080

# Disable actuator security for tests
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always 